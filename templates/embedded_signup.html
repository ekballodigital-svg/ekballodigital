{% extends "base.html" %}
{% block content %}
<div class="container" style="max-width: 560px; margin: 60px auto; text-align: center;">
  <h1>Conectar WhatsApp do cliente</h1>
  <p>Clique no botão abaixo para o cliente conectar a conta de WhatsApp Business dele diretamente na sua plataforma.</p>

  <button id="btnEmbeddedSignup" class="btn btn-primary" style="padding: 12px 28px; font-size: 16px; margin-top: 20px;">
    Conectar WhatsApp Business
  </button>

  <div id="signupStatus" style="margin-top: 24px; font-size: 14px;"></div>
</div>

<!-- SDK do Facebook -->
<script>
  window.fbAsyncInit = function () {
    FB.init({
      appId: "{{ app_id }}",
      autoLogAppEvents: true,
      xfbml: true,
      version: "v25.0"
    });
  };
</script>
<script async defer src="https://connect.facebook.net/pt_BR/sdk.js"></script>

<script>
  const statusEl = document.getElementById("signupStatus");
  let signupSession = {}; // guarda waba_id / phone_number_id vindos do postMessage

  function setStatus(msg, isError) {
    statusEl.textContent = msg;
    statusEl.style.color = isError ? "#c0392b" : "#2c3e50";
  }

  // Captura os eventos que o popup do Facebook envia via postMessage
  window.addEventListener("message", (event) => {
    if (!event.origin.endsWith("facebook.com")) return;
    let data;
    try {
      data = JSON.parse(event.data);
    } catch (e) {
      return;
    }

    if (data.type === "WA_EMBEDDED_SIGNUP") {
      console.log("WA_EMBEDDED_SIGNUP event:", data);

      if (data.event === "FINISH" || data.event === "FINISH_ONLY_WABA") {
        signupSession.waba_id = data.data.waba_id;
        signupSession.phone_number_id = data.data.phone_number_id;
        setStatus("Conta conectada. Finalizando cadastro...");
      }

      if (data.event === "CANCEL") {
        setStatus("Cadastro cancelado pelo usuário na etapa: " + (data.data && data.data.current_step), true);
      }

      if (data.event === "ERROR") {
        setStatus("Erro no cadastro: " + JSON.stringify(data.data), true);
      }
    }
  });

  function finalizarCadastro(code) {
    if (!signupSession.waba_id || !signupSession.phone_number_id) {
      setStatus("Não recebemos waba_id/phone_number_id do popup. Tente novamente.", true);
      return;
    }

    setStatus("Registrando número e ativando a conta...");

    fetch("/api/embedded-signup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        code: code,
        waba_id: signupSession.waba_id,
        phone_number_id: signupSession.phone_number_id
      })
    })
      .then((r) => r.json())
      .then((resp) => {
        if (resp.success) {
          setStatus("Cliente conectado com sucesso: " + (resp.client.business_name || resp.client.id));
        } else {
          setStatus("Erro: " + JSON.stringify(resp), true);
        }
      })
      .catch((err) => setStatus("Erro de rede: " + err, true));
  }

  document.getElementById("btnEmbeddedSignup").addEventListener("click", () => {
    signupSession = {};
    setStatus("Abrindo janela de conexão...");

    FB.login(
      function (response) {
        if (response.authResponse && response.authResponse.code) {
          finalizarCadastro(response.authResponse.code);
        } else {
          setStatus("Login cancelado ou não autorizado.", true);
        }
      },
      {
        config_id: "{{ config_id }}",
        response_type: "code",
        override_default_response_type: true,
        extras: {
          setup: {
            business: {
              id: null,
              name: null,
              email: null,
              phone: { code: null, number: null },
              website: null,
              address: {
                streetAddress1: null,
                streetAddress2: null,
                city: null,
                state: null,
                zipPostal: null,
                country: null
              },
              timezone: null
            },
            phone: {
              displayName: null,
              category: null,
              description: null
            },
            preVerifiedPhone: { ids: null },
            solutionID: null,
            whatsAppBusinessAccount: { ids: null }
          },
          featureType: "whatsapp_business_app_onboarding",
          sessionInfoVersion: "3",
          version: "v4",
          features: [{ name: "app_only_install" }]
        }
      }
    );
  });
</script>
{% endblock %}
